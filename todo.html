<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1b2a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(20, 40, 70, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
                        0 0 100px rgba(30, 60, 120, 0.3);
            border: 1px solid rgba(100, 150, 200, 0.2);
        }

        h1 {
            color: #e8f0ff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            background: rgba(10, 25, 50, 0.8);
            color: #e8f0ff;
            font-size: 1rem;
            outline: none;
            border: 1px solid rgba(100, 150, 200, 0.3);
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: rgba(200, 220, 255, 0.4);
        }

        input[type="text"]:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
        }

        .add-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1e5799 0%, #4a9eff 100%);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(74, 158, 255, 0.4);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: rgba(15, 35, 65, 0.6);
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(100, 150, 200, 0.15);
            animation: slideIn 0.3s ease;
            transition: all 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item:hover {
            background: rgba(25, 50, 85, 0.7);
            border-color: rgba(100, 150, 200, 0.3);
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: rgba(200, 220, 255, 0.4);
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(100, 150, 200, 0.5);
            border-radius: 6px;
            margin-right: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .checkbox:hover {
            border-color: #4a9eff;
        }

        .checkbox.checked {
            background: linear-gradient(135deg, #1e5799 0%, #4a9eff 100%);
            border-color: #4a9eff;
        }

        .checkbox.checked::after {
            content: '✓';
            color: #fff;
            font-size: 14px;
        }

        .todo-text {
            flex: 1;
            color: #e8f0ff;
            font-size: 1rem;
            word-break: break-word;
        }

        .delete-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: rgba(255, 100, 100, 0.6);
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: rgba(255, 80, 80, 0.2);
            color: #ff6b6b;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(200, 220, 255, 0.4);
            font-size: 1rem;
        }

        .todo-count {
            text-align: center;
            margin-top: 20px;
            color: rgba(200, 220, 255, 0.5);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ToDo List</h1>
        <div class="input-section">
            <input type="text" id="todoInput" placeholder="タスクを入力...">
            <button class="add-btn" onclick="addTodo()">+</button>
        </div>
        <ul class="todo-list" id="todoList"></ul>
        <div class="todo-count" id="todoCount"></div>
    </div>

    <script>
        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        function renderTodos() {
            const list = document.getElementById('todoList');
            const countEl = document.getElementById('todoCount');

            if (todos.length === 0) {
                list.innerHTML = '<li class="empty-state">タスクがありません</li>';
                countEl.textContent = '';
                return;
            }

            list.innerHTML = todos.map((todo, index) => `
                <li class="todo-item ${todo.completed ? 'completed' : ''}">
                    <div class="checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodo(${index})"></div>
                    <span class="todo-text">${escapeHtml(todo.text)}</span>
                    <button class="delete-btn" onclick="deleteTodo(${index})">×</button>
                </li>
            `).join('');

            const remaining = todos.filter(t => !t.completed).length;
            countEl.textContent = `${remaining} 件の未完了タスク`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();

            if (text) {
                todos.unshift({ text, completed: false });
                saveTodos();
                renderTodos();
                input.value = '';
            }
        }

        function deleteTodo(index) {
            todos.splice(index, 1);
            saveTodos();
            renderTodos();
        }

        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            saveTodos();
            renderTodos();
        }

        document.getElementById('todoInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        renderTodos();
    </script>
</body>
</html>
